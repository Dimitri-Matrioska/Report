<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AFRY - Performance Semanal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div class="dashboard-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <div class="brand-name">GrupoBoticário</div>
          <div class="brand-mark">
            <span class="dot green"></span>
            <span class="dot yellow"></span>
            <span class="dot blue"></span>
          </div>
        </div>
        <div class="brand-footer">AFRY</div>
      </aside>

      <main class="main-panel">
        <header class="toolbar">
          <div class="title-block">
            <span class="eyebrow">Relatório</span>
            <h1 id="report-title">PERFORMANCE SEMANAL</h1>
          </div>
          <div class="filters">
            <label>
              <span>Disciplina</span>
              <select id="discipline-filter">
                <option value="all">Todas</option>
              </select>
            </label>
            <label>
              <span>Status</span>
              <select id="status-filter">
                <option value="all">Todos</option>
              </select>
            </label>
          </div>
        </header>

        <section class="kpis" id="kpis"></section>

        <section class="panel-grid">
          <article class="panel large-panel">
            <div class="panel-header">
              <h2>Progresso por disciplina</h2>
            </div>
            <canvas id="disciplineChart"></canvas>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>Ações em andamento</h2>
            </div>
            <ul id="actionsList" class="mini-list"></ul>
          </article>

          <article class="panel">
            <div class="panel-header">
              <h2>Itens de status</h2>
            </div>
            <ul id="statusList" class="mini-list"></ul>
          </article>

          <article class="panel full-width">
            <div class="panel-header">
              <h2>Parâmetros verificados</h2>
            </div>
            <div id="metadata-box" class="metadata-box"></div>
          </article>
        </section>
      </main>
    </div>

    <script src="static/app.js"></script>
  </body>
</html>
